name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built site is published to the gh-pages branch, which is what
# GitHub Pages (or any other static host) serves.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Until launch, the deployed site shows the draft samples (marked as
      # samples and hidden from search engines) so pages can be reviewed.
      # Delete this line at launch.
      PUBLIC_SHOW_DRAFTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Unit tests
        run: npm test
      - name: Type and template check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Link check
        run: npm run links
      - name: Publish the built site to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
