name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built site is published to the gh-pages branch, which is what
# GitHub Pages (or any other static host) serves.
permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Until launch, the deployed site shows the draft samples (marked as
      # samples and hidden from search engines) so pages can be reviewed.
      # Delete this line at launch.
      PUBLIC_SHOW_DRAFTS: 'true'
      # When the site moves to its own domain, remove the "#" from these two
      # lines and put your domain in the first (see the README).
      # SITE_URL: 'https://caskscents.com'
      # BASE_PATH: '/'
      # Optional. Remove the "#" and fill these in to switch them on:
      # the email signup form (your Buttondown name) and visit counting
      # (your Cloudflare Web Analytics token).
      # PUBLIC_BUTTONDOWN_USERNAME: 'your-buttondown-name'
      # PUBLIC_CF_ANALYTICS_TOKEN: 'your-cloudflare-token'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Unit tests
        run: npm test
      - name: Type and template check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Link check
        run: npm run links
      # The site exactly as it will launch: drafts and samples hidden. This
      # catches anything that only breaks once the samples are gone.
      - name: Check the launch build (no drafts)
        env:
          PUBLIC_SHOW_DRAFTS: 'false'
        run: |
          npx astro build --outDir dist-launch
          node scripts/check-links.mjs dist-launch
      # Pins the exact package versions the first time, so later builds
      # cannot change under you. Does nothing once package-lock.json exists.
      - name: Save the package versions if they are not saved yet
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -q -m "Pin package versions (package-lock.json)"
            git push -q origin HEAD:main
          fi
      - name: Publish the built site to the gh-pages branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
